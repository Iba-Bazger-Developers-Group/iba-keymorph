name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows (tests, app, installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; else echo "VERSION=1.0.0" >> "$GITHUB_ENV"; fi

      - name: Core tests
        run: dotnet test windows/IbaKeyMorph.Core.Tests -c Release --logger "console;verbosity=normal"

      - name: Publish single-file executables
        shell: pwsh
        run: |
          foreach ($rid in 'win-x64', 'win-arm64') {
            dotnet publish windows/IbaKeyMorph/IbaKeyMorph.csproj -c Release -r $rid --self-contained true `
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
              -p:EnableCompressionInSingleFile=true -p:Version=$env:VERSION `
              -o "windows/publish/$rid"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Copy-Item "windows/publish/$rid/IbaKeyMorph.exe" "windows/publish/IbaKeyMorph-$env:VERSION-$rid-portable.exe"
          }

      - name: Build installers (Inno Setup)
        shell: pwsh
        run: |
          choco upgrade innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          foreach ($arch in 'x64', 'arm64') {
            & $iscc "/DAppVersion=$env:VERSION" "/DSourceDir=..\publish\win-$arch" "/DArch=$arch" windows/installer/IbaKeyMorph.iss
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: IbaKeyMorph-windows
          path: |
            windows/publish/*-setup.exe
            windows/publish/*-portable.exe

  macos:
    name: macOS (tests, app)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; else echo "VERSION=1.0.0" >> "$GITHUB_ENV"; fi

      - name: Core tests
        run: swift test --package-path macos

      - name: Build app bundle
        run: BUILD_NUMBER="$GITHUB_RUN_NUMBER" ./macos/build-app.sh

      - uses: actions/upload-artifact@v4
        with:
          name: IbaKeyMorph-macos
          path: macos/build/*.zip

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
