name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Опубликовать релиз этой версии, например 1.0.0 (пусто — только сборка)"
        required: false
        default: ""

env:
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version || '' }}

permissions:
  contents: read

jobs:
  windows:
    name: Windows (tests, app, installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; elif [[ -n "$RELEASE_VERSION" ]]; then v="${RELEASE_VERSION#v}"; else v="1.0.0"; fi
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version must look like 1.2.3, got '$v'"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Core tests
        run: dotnet test windows/IbaKeyMorph.Core.Tests -c Release --logger "console;verbosity=normal"

      - name: Publish single-file executables
        shell: pwsh
        run: |
          foreach ($rid in 'win-x64', 'win-arm64') {
            dotnet publish windows/IbaKeyMorph/IbaKeyMorph.csproj -c Release -r $rid --self-contained true `
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
              -p:EnableCompressionInSingleFile=true -p:Version=$env:VERSION `
              -o "windows/publish/$rid"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Copy-Item "windows/publish/$rid/IbaKeyMorph.exe" "windows/publish/IbaKeyMorph-$env:VERSION-$rid-portable.exe"
          }

      - name: Smoke test (app starts and stays up)
        shell: pwsh
        run: |
          $app = Start-Process "windows/publish/win-x64/IbaKeyMorph.exe" -PassThru
          Start-Sleep -Seconds 10
          $log = Join-Path $env:APPDATA "IBA\KeyMorph\keymorph.log"
          if (Test-Path $log) { Get-Content $log }
          if ($app.HasExited) { Write-Error "IbaKeyMorph exited with code $($app.ExitCode)"; exit 1 }
          Stop-Process -Id $app.Id -Force

      - name: Build installers (Inno Setup)
        shell: pwsh
        run: |
          choco upgrade innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          foreach ($arch in 'x64', 'arm64') {
            & $iscc "/DAppVersion=$env:VERSION" "/DSourceDir=..\publish\win-$arch" "/DArch=$arch" windows/installer/IbaKeyMorph.iss
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: IbaKeyMorph-windows
          path: |
            windows/publish/*-setup.exe
            windows/publish/*-portable.exe

  macos:
    name: macOS (tests, app)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; elif [[ -n "$RELEASE_VERSION" ]]; then v="${RELEASE_VERSION#v}"; else v="1.0.0"; fi
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version must look like 1.2.3, got '$v'"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Core tests
        run: swift test --package-path macos

      - name: Build app bundle
        run: BUILD_NUMBER="$GITHUB_RUN_NUMBER" ./macos/build-app.sh

      - name: Smoke test (app starts and stays up)
        run: |
          "macos/build/IBA KeyMorph.app/Contents/MacOS/IBAKeyMorph" &
          app=$!
          sleep 10
          if ! kill -0 "$app" 2>/dev/null; then
            wait "$app"; echo "::error::IBAKeyMorph exited with code $?"; exit 1
          fi
          kill "$app"

      - uses: actions/upload-artifact@v4
        with:
          name: IbaKeyMorph-macos
          path: macos/build/*.zip

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_version != '')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="${RELEASE_VERSION#v}"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: IBA KeyMorph ${{ env.VERSION }}
          files: dist/*
          generate_release_notes: true
          body: |
            ## Что скачать

            **Windows 10/11**
            - `IbaKeyMorph-${{ env.VERSION }}-x64-setup.exe` — установщик (рекомендуется, права администратора не нужны)
            - `IbaKeyMorph-${{ env.VERSION }}-win-x64-portable.exe` — портативная версия одним файлом
            - Для ноутбуков на ARM — файлы `arm64`

            **macOS 13+**
            - `IBA-KeyMorph-${{ env.VERSION }}-macOS.zip` — распакуйте, перенесите в «Программы», первый запуск — правый щелчок → «Открыть», затем разрешите доступ в «Универсальном доступе»

            Горячие клавиши: `Pause` / двойной `Shift` — исправить или отменить последнее слово; `Shift+Pause` / двойной `⌥` — исправить выделенный текст.
